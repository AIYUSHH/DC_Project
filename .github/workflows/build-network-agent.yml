name: Build BitSecure network agent

on:
  push:
    branches: [feature/add-somya-developer]
    paths:
      - "tools/network-agent/**"
      - ".github/workflows/build-network-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} helper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: network_agent-windows.exe
            binary: network_agent.exe
          - os: ubuntu-latest
            asset: network_agent-linux
            binary: network_agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --name network_agent tools/network-agent/network_agent.py
      - name: Rename Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/network_agent.exe dist/${{ matrix.asset }}
      - name: Rename Linux asset
        if: runner.os == 'Linux'
        run: cp dist/network_agent dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish downloadable helpers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: network-agent-latest
          name: BitSecure Network Agent (latest)
          prerelease: true
          make_latest: false
          files: release-assets/*
